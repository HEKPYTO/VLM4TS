name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff check, warnings as errors)
        run: uv run --extra dev ruff check . --output-format=github

      - name: Format check (ruff format, warnings as errors)
        run: uv run --extra dev ruff format --check .

      - name: Tests (warnings as errors for src.* only)
        run: uv run --extra dev python -m pytest -q
        env:
          OPENAI_API_KEY: ""  # VLM tests use mocks, no network

      - name: Docker compose config
        run: docker compose config --quiet

      - name: Build package
        run: uv build

      - name: Wheel smoke test (warnings as errors for src.* only)
        run: uv run --with dist/*.whl --no-project python -W error::UserWarning:src.* -W error::DeprecationWarning:src.* -W error::FutureWarning:src.* -c "import src.vit4ts; import src.render; import src.vlm_refine; print('wheel ok')"
