name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --extra dev --frozen
      - run: uv run --extra dev ruff check . --output-format=github
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev python -m pytest -q
        env:
          OPENAI_API_KEY: ""
      - run: uv export --frozen --no-dev --no-emit-project --no-annotate --no-header | uv run --extra dev pip-audit -r /dev/stdin --disable-pip --no-deps
      - run: uv build
      - run: |
          tmpdir=$(mktemp -d)
          uv run --python 3.11 --with "$(pwd)"/dist/*.whl --no-project --directory "$tmpdir" python -c "import vlm4ts.vit4ts, vlm4ts.render, vlm4ts.vlm_refine; print('wheel ok')"
      - run: docker compose config --quiet
      - run: docker build -t vlm4ts-public-readiness:check .
      - run: docker run --rm vlm4ts-public-readiness:check python -c "import vlm4ts.vit4ts, vlm4ts.render, vlm4ts.vlm_refine; print('container ok')"
