[project]
name = "vlm4ts"
version = "0.1.0"
description = "An educational, simplified VLM4TS-inspired time-series anomaly prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["time-series", "anomaly-detection", "vision-language", "prototype"]
dependencies = [
  "torch==2.13.0",
  "torchvision==0.28.0",
  "open-clip-torch==3.3.0",
  "pillow==12.3.0",
  "matplotlib==3.11.1",
  "numpy==2.4.6",
  "pandas==3.0.5",
  "streamlit==1.62.0",
  "openai==3.6.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "ruff==0.16.5",
  "pip-audit==2.10.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "__pycache__", "assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF012"]

[tool.hatch.build]
exclude = ["/.github", "/autoresearch"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlm4ts"]
